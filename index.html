<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #FAEEE6;
            overflow: hidden;
        }

        #content {
            background-color: #FFC0CB;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            padding: 20px;
            text-align: center;
            z-index: 2;
        }

        #yesButton, #noButton {
            font-size: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            transition: 0.3s;
            padding: 15px;
            border: none;
            cursor: pointer;
            margin: 10px;
        }

        #yesButton {
            background-color: #4CAF50;
            color: white;
        }

        #noButton {
            background-color: #f44336;
            color: white;
        }

        #noButton:disabled {
            background-color: #ddd;
            color: #666;
            box-shadow: none;
        }

        /* HEARTS */
        .heart {
            position: fixed;
            top: -100px;
            width: 100px;
            height: 100px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 29.6"><path fill="%23FF0000" d="M16 29.6c-1-.6-21-12.6-16-20C5.7 5.6 10.3 4 16 11c5.7-7 10.3-5.4 16-2.6 5 7.4-15 19.6-16 20z"/></svg>');
            animation: fall 4s linear infinite;
            pointer-events: none;
        }

        @keyframes fall {
            0% { transform: translateY(-100vh); }
            100% { transform: translateY(100vh); }
        }

        /* LILIES */
        .lily {
            position: fixed;
            bottom: -120px;
            width: 80px;
            height: 80px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path fill="%23FFFFFF" d="M32 6c6 10 18 18 18 30 0 10-8 18-18 18S14 46 14 36c0-12 12-20 18-30z"/><circle cx="32" cy="36" r="4" fill="%23FFD700"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            animation: rise 6s ease-in-out forwards;
            opacity: 0.95;
            pointer-events: none;
        }

        @keyframes rise {
            0% {
                transform: translateY(0) scale(0.8);
                opacity: 0;
            }
            30% {
                opacity: 1;
            }
            100% {
                transform: translateY(-120vh) scale(1);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div id="content">
        <h2 id="question">Would my beautiful stinky baby date me?</h2>

        <button id="yesButton">YES</button>
        <button id="noButton">NO</button>

        <p id="message"></p>
    </div>

    <script>
        var noClickCount = 0;

        document.getElementById('noButton').addEventListener('click', function() {
            noClickCount++;

            if (noClickCount == 1) {
                document.getElementById('yesButton').style.fontSize = '30px';
            } 
            else if (noClickCount == 2) {
                this.style.fontSize = '10px';
                document.getElementById('yesButton').style.fontSize = '40px';
            } 
            else if (noClickCount == 3) {
                document.getElementById('yesButton').style.fontSize = '90px';
                this.style.fontSize = '7px';
            } 
            else if (noClickCount >= 4 && noClickCount < 15) {
                this.style.position = 'absolute';
                this.style.left = Math.random() * window.innerWidth + 'px';
                this.style.top = Math.random() * window.innerHeight + 'px';
                document.getElementById('message').innerText = 'Are you sure? 👀';
            } 
            else if (noClickCount == 15) {
                document.getElementById('message').innerText = 'Oh no! You broke the button :c';
                this.disabled = true;
                this.style.color = 'grey';
            }
        });

        document.getElementById('yesButton').addEventListener('click', function() {

            document.getElementById('question').innerText = 'YEYYYYYYYYY 💖';

            document.getElementById('message').innerText =
                "I knew it 😌💗 You just made me the happiest person ever. Baby the you for choosing me. I will do everything to make you happy. Mahal na mahal kita Cassie ko.";

            document.getElementById('message').style.fontSize = '22px';
            document.getElementById('message').style.marginTop = '15px';

            // HEARTS
            for (var i = 0; i < 100; i++) {
                var heart = document.createElement('div');
                heart.className = 'heart';
                heart.style.left = Math.random() * window.innerWidth + 'px';
                heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                heart.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(heart);
            }

            // 🌸 LILIES (final touch)
            for (var j = 0; j < 25; j++) {
                var lily = document.createElement('div');
                lily.className = 'lily';
                lily.style.left = Math.random() * window.innerWidth + 'px';
                lily.style.animationDelay = (Math.random() * 2) + 's';
                document.body.appendChild(lily);
            }

            document.getElementById('yesButton').style.display = 'none';
            document.getElementById('noButton').style.display = 'none';
        });
    </script>
</body>
</html>
